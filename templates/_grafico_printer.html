<p class="mt-1 text-sm text-gray-600">Cópias e impressões em páginas, por setor e mês. Sem barra significa que não há relatório salvo; zero aparece na tabela abaixo.</p>
<div class="mt-3 flex flex-wrap gap-4 text-sm" aria-hidden="true">
    <span><span class="inline-block h-3 w-3 rounded-sm bg-blue-700"></span> Saúde</span>
    <span><span class="inline-block h-3 w-3 rounded-sm bg-emerald-700"></span> Tesouro</span>
    <span><span class="inline-block h-3 w-3 rounded-sm bg-amber-600"></span> Educação</span>
</div>
<div id="grafico-{{ grafico_prefixo }}-printer" class="mt-2 overflow-x-auto" aria-hidden="true"></div>
<p id="grafico-{{ grafico_prefixo }}-vazio" class="mt-2 text-sm text-gray-600" role="status">Salve relatórios para visualizar o gráfico.</p>
<details id="tabela-grafico-{{ grafico_prefixo }}-printer" class="mt-3" hidden>
    <summary class="cursor-pointer text-sm font-semibold">Ver dados do gráfico em tabela</summary>
    <div class="mt-2 overflow-x-auto">
        <table class="w-full border-collapse text-sm [&_th]:border-b [&_th]:p-2 [&_th]:text-left [&_td]:border-b [&_td]:p-2">
            <thead><tr><th>Mês</th><th>Saúde</th><th>Tesouro</th><th>Educação</th></tr></thead>
            <tbody id="dados-grafico-{{ grafico_prefixo }}-printer"></tbody>
        </table>
    </div>
</details>
